<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendaFlow 3C Plus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 14px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.8; margin-top: 2px; }
    .content { padding: 16px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status.ativo { background: #052e16; border: 1px solid #166534; color: #4ade80; }
    .status.inativo { background: #1e1b4b; border: 1px solid #3730a3; color: #818cf8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.verde { background: #4ade80; animation: pulse 2s infinite; }
    .dot.cinza { background: #6b7280; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .info { font-size: 11px; color: #64748b; margin-bottom: 12px; line-height: 1.5; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger {
      background: #1e1b4b;
      border: 1px solid #3730a3;
      color: #f87171;
      margin-top: 8px;
    }
    .btn-danger:hover { background: #2d1b1b; }
    .token-info {
      font-size: 10px;
      color: #475569;
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>VendaFlow 3C Plus</h1>
      <p>Extensão de telefonia</p>
    </div>
  </div>

  <div class="content">
    <div id="status" class="status inativo">
      <div class="dot cinza"></div>
      <span>WebRTC desconectado</span>
    </div>

    <p class="info" id="info">
      Abra o VendaFlow CRM e clique em "Entrar em campanha" para ativar o WebRTC automaticamente.
    </p>

    <div id="token-info" class="token-info" style="display:none"></div>

    <button class="btn btn-danger" id="btn-desconectar" style="display:none">
      Desconectar ramal
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
